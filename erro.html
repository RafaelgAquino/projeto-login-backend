<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocorreu um erro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #262626;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 400px;
            padding: 20px;
        }
        .error-icon {
            margin-bottom: 24px;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 12px 0;
            color: #111;
        }
        p {
            font-size: 14px;
            color: #737373;
            margin: 0 0 32px 0;
            line-height: 1.5;
        }
        .reload-btn {
            background-color: #5851db;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            box-shadow: 0 4px 12px rgba(88, 81, 219, 0.25);
        }
        .reload-btn:hover {
            background-color: #473fc8;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <!-- Ícone SVG simulando a janela do navegador com o triângulo de aviso -->
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="4" width="20" height="16" rx="2" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 8H22" stroke="black" stroke-width="1.5"/>
                <circle cx="5" cy="6" r="0.75" fill="black"/>
                <circle cx="7.5" cy="6" r="0.75" fill="black"/>
                <circle cx="10" cy="6" r="0.75" fill="black"/>
                <!-- Triângulo com gradiente -->
                <path d="M12 10.5L15.5 16.5H8.5L12 10.5Z" fill="url(#paint0_linear)"/>
                <path d="M12 13.25V14.25" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
                <circle cx="12" cy="15.5" r="0.75" fill="white"/>
                <defs>
                    <linearGradient id="paint0_linear" x1="8.5" y1="10.5" x2="15.5" y2="16.5" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#FFC107"/>
                        <stop offset="0.5" stop-color="#FF5722"/>
                        <stop offset="1" stop-color="#E91E63"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <h1>Ocorreu um erro</h1>
        <p>Ocorreu um problema e não foi possível carregar a página.</p>
        <button class="reload-btn" onclick="window.location.reload();">Recarregar página</button>
    </div>
</body>
</html>
